[project]
name = "sutton-barto-mcp"
version = "0.1.0"
description = "MCP server exposing the full text of Sutton & Barto's 'Reinforcement Learning: An Introduction' (2nd ed.)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastmcp>=3.4.2",
    # Pulled in by fastmcp, but the OAuth layer imports them directly.
    "mcp>=1.2.0",
    "starlette>=0.37.0",
]

[project.urls]
Homepage = "https://github.com/BNJ02/sutton-barto-mcp"

[tool.uv]
package = false
